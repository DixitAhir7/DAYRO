    <!--login-->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close text-danger">&times;</span>
            <h2 class="text-white" data-i18n="logo">DAYRO</h2>
            <div class="loginbg">
                <form id="loginForm" name="form" class="mt-2">
                    <input type="text" class="email" placeholder="enter your email"><br>
                    <p id="emailerror"></p>
                    <p id="emailregex"></p>
                    <div class="password d-flex">
                        <input class="password" type="password" placeholder="enter password"><br>
                        <span id="toggleIcon" class=" style="cursor:pointer;"><i class="bi bi-eye-fill"></i></span>
                    </div>
                    <p id="passworderror"></p>
                    <p id="passwordregex"></p>
