<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css-bt/bootstrap.min.css">
    <link rel="stylesheet" href="media-css/media.css">
    <script defer src="js/script.js"></script>
    <script defer src="js-bt/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- offline font -->
    <!-- <link rel="stylesheet" href="font-awesome/all.min.css">
    <link rel="stylesheet" href="font-awesome/fontawesome.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <style>
        /* background-img for login page */

        .bg-img::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            background-image: url('IMG/main-bg.avif');
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .modal-content {
            position: relative;
            z-index: 1;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar for medium and larger screens -->
                <div class="sidebar col-md-2" id="sidebar">
                    <a class="text-black fs-4 d-block p-3 logo text-black text-center" href="#">D A Y R O</a>
                    <nav>
                        <div class="nav-list p-3">

                            <!-- in about all about this web -->
                            <div class="about-web d-flex justify-content-evenly align-items-center mb-3">
                                <button class="btn btn-outline-dark d-md-none" id="closeSidebar">Close</button>
                            </div>

                            <div class="about-web d-flex justify-content-evenly align-items-center mb-3">
                                <a class="text-black" href="about-page/about.html">ABOUT</a>
                            </div>

                            <!-- dropdown for artists -->
                            <div class="dropdown mb-3">
                                <div class="menu-item d-flex justify-content-evenly align-items-center"
                                    onclick="toggleDropdown()">
                                    <a class="dropbutton text-black">KALAKARO</a>
                                    <i class="fa-solid fa-caret-down icon-ddown"></i>
                                </div>
                                <div class="dropdown-content" id="submenu">
                                    <a href="#">Hasya Kalakaro</a>
                                    <a href="#">Folk Singers</a>
                                </div>
                            </div>

                            <!-- in this charan history will be added -->
                            <div class="history-charan d-flex justify-content-evenly align-items-center">
                                <a href="ch/history.html">CHARAN HISTORY</a>
                            </div>


                            <!-- in this i'll store user's account data :) -->
                            <hr>
                            <div class="user-info mt-3">
                                <div class="login-btn">
                                    <a id="openmodal" class="mt-4 text-black">Login</a>
                                </div>
                                <div class="account">
                                    <span class="d-inline">
                                        <i class="fa-solid fa-user"></i>
                                        <a class="text-black" href="#">Account</a>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </nav>
                </div>

                <!-- in this main-content or video will be added according to the plan -->

                <div class="col-md-10">
                    <div class="main-content">
                        <button class="btn btn-dark d-md-none" id="toggleSidebar">☰</button>
                        <h2 class="text-md-center">WELCOME TO DAYRO</h2>
                        <p class="text-md-center">The Soul of Gujarat's Folk Culture</p>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 class="text-warning text-center">Login</h2>
            <div class="bg-img">
                <form id="loginForm" class="mt-3">
                    <input class="email" type="email" placeholder="enter your email" required><br><br>
                    <input class="password" type="password" placeholder="enter password" required><br><br>
                    <button type="submit" class="submit">Submit</button>
                    <input type="reset" value="reset" id="reset">
                </form>
            </div>
        </div>
    </div>

</body>

</html>
