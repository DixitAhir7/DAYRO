        width: 100%;

<body>
    <header>

        <!-- sidebar -->
        <div class="sidebar">
            <button class="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="sidebar-header">
                <span>D A Y R O</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>
                        ABOUT
                    </span>
                </a>
                <div class="nav-item dropdown">
                    <div class="dropdown-header" onclick="toggleDropdown(this)">
                        <div class="dropdown-title">
                            <i class="fas fa-chart-line"></i>
                            <span>KALAKARO</span>
                        </div>
                        <i class="fas fa-chevron-down dropdown-icon"></i>
                    </div>
                    <div class="dropdown-content">
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-chart-bar"></i>
                            <span>folk singers</span>
                        </a>
                        <a href="#" class="dropdown-item">
                            <i class="fas fa-chart-pie"></i>
                            <span>hasya kalakaro</span>
                        </a>
                    </div>
                </div>
                <a href="#" class="nav-item">
                    <span>CHARAN SAHITYA</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Account</span>
                </a>
            </nav>
        </div>

        <div class="main-content">
            <h1>Main Content Area</h1>
            <p>Your page content goes here.</p>
        </div>

        <!-- modal -->
        <button id="openModal">Login</button>

        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 class="text-warning text-center">Login Form</h2>
                <form id="loginForm" class="mt-3">
                    <input class="email" type="email" placeholder="enter your email" required><br><br>
                    <input class="password" type="password" placeholder="enter password" required><br><br>
                    <button type="submit" class="submit">Submit</button>
                    <input type="reset" value="reset" id="reset">
                </form>
            </div>
        </div>

    </header>
