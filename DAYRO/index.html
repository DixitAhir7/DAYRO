<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYRO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css-bt/bootstrap.min.css">
    <link rel="stylesheet" href="media-css/media.css">

    <script defer src="js-bt/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="theme-js/theme.js"></script>
    <script defer src="js/script.js"></script>

    <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons-1.11.3/font/bootstrap-icons.css">


    <style>

        .bg-img::before {
            content: "";

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;
            border-radius: 10px;

        .modal-content {

            z-index: 1;
            background-color: white;

                                </div>
                            </div>

                            </div>

                            <hr class="mt-5">
                            <div class="user-info">
                                <div class="login-btn">
                                    <span>
                                        <i class="bi bi-door-open-fill"></i>
                                        <button id="openmodal" class="text text-black">Login</button>
                                    </span>
                                </div>
                                <div class="account">
                                    <span class="d-inline">
                                        <i class="bi bi-person-heart"></i>

                                </div>
                            </div>
                            <div class="theme-mode">

                    <input type="reset" value="reset" id="reset">
