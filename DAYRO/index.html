    <div class="display-icon">

    <!--login modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close text-danger">&times;</span>
            <h2 class="text-center text-white">Dayro</h2>
            <div class="loginbg">
                <form id="loginForm" class="mt-2">

                    <p id="emailerror" style="display: none;"></p>
                    <p id="emailregex" style="display: none;"></p>
                    <div class="password d-flex">
                        <input class="password" type="password" placeholder="enter password"><br>
                        <span id="toggleIcon" class="mt-3" style="cursor:pointer;"><i class="bi bi-eye-fill"></i></span>
                    </div>
                    <p id="passworderror" style="display: none;"></p>
                    <p id="passwordregex" style="display: none;"></p>
                    <button type="submit" class="submit">Login</button>
