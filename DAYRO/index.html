<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYRO</title>
    <link rel="stylesheet" href="css-bt/bootstrap.min.css">
    <script defer src="js-bt/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="theme-js/theme.js"></script>
    <script type="module" defer src="js/script.js"></script>
    <link rel="stylesheet" href="media-css/media.css">
    <link rel="stylesheet" href="bootstrap-icons/bootstrap-icons-1.11.3/font/bootstrap-icons.css">

    <style>
        /* background-img for login page */

        .bg-img::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            background-image: url('IMG/main-bg.avif');
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .modal-content {
            position: relative;
            z-index: 1;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="sidebar sidebar-collapse overflow-hidden col-md-2 " id="sidebar">
                    <a class="logo labels text-black fs-4 d-block text-black text-md-center mt-2" href="">D A Y R O</a>
                    <img class="icons-sidebar" src="IMG/lion-logo-Photoroom.png" alt="logo">
                    <nav>
                        <div class="nav-list mt-4">
                            <!-- dropdown for artists -->
                            <div class="dropdown">
                                <div class="menu-item d-flex justify-content-center">
                                    <span class="dropbutton labels text-black text-center fw-medium"
                                        onclick="toggleDropdown()">Kalakaro</span>
                                    <img class="icons-sidebar" src="IMG/harmonium-logo for kalakaro-Photoroom.png"
                                        alt="">
                                </div>
                                <div class="dropdown-content" id="submenu">
                                    <a href="hasyaArtists/hasya.html">Hasya Kalakaro</a>
                                    <a href="folk-singers/folksinger.html">Folk Singers</a>
                                </div>
                            </div>


                            <!-- in this charan history will be added -->
                            <div class="history-charan d-flex justify-content-center">
                                <i class="fa-solid fa-landmark"></i>
                                <a href="ch/history.html" class="text-center labels text-black mt-3 fw-medium">Charan
                                    History</a>
                                <img class="icons-sidebar" src="IMG/pillar-charan_history-Photoroom.png" alt="">
                            </div>

                            <div class="events d-flex justify-content-center fw-medium mt-3">
                                <a class="text-black labels text-center" href="events/event.html">Events</a>
                            </div>
                            <div class="for-artist fw-medium d-flex justify-content-center text-center mt-3">
                                <a class="text-black labels" href="">For Artist</a>
                            </div>

                            <div class="video-uploader fw-medium d-flex justify-content-center text-center mt-3">
                                <a href="videos/videos.html" class="text-black labels">Upload videos</a>
                            </div>

                            <!-- in about all about this web -->
                            <div class="about-page d-flex justify-content-center mt-3">
                                <i class="fas fa-info-circle about-icon"></i>
                                <a class="text-black fw-medium labels" href="about-page/about.html">About dayro</a>
                                <img class="icons-sidebar" src="IMG/about-png-Photoroom.png" alt="">
                            </div>
                            <!-- in this i'll store user's account data :) -->

                            <hr class="mt-lg-5">
                            <div class="user-info">
                                <div class="login-btn">
                                    <span>
                                        <i class="bi bi-door-open-fill icons-sidebar"></i>
                                        <button id="sidebarmodal" data-bs-toggle="modal"
                                            class="text-black labels">Login</button>
                                    </span>
                                </div>
                                <div class="account">
                                    <span class="d-inline">
                                        <i class="bi bi-person-heart icons-sidebar"></i>
                                        <a class="text-black labels" href="account-html/acc.html">Account</a>
                                    </span>
                                </div>
                            </div>
                            <div class="theme-mode">
                                <i class="bi bi-moon-fill icons-sidebar"></i>
                                <a class="text-black labels">dark</a>
                            </div>

                            <div class="time-spent">
                                <span>
                                    <i class="bi bi-alarm icons-sidebar"></i>
                                    <a class="text-black labels" href="time/time.html">time watched</a>
                                </span>
                            </div>
                        </div>
                    </nav>
                </div>

                <!-- in this main-content or video will be added according to the plan -->

                <div class="col-lg-12 col-md-12 col-sm-12">
                    <div class="main-content">
                        <div class="display-icon">
                            <a class="close-sidebar text-decoration-none text-black" href=""><i
                                    class="bi bi-x-circle-fill"></i></a>
                            <a class="text-black sidebarToggle fs-4" href=""><i class="bi bi-list sidebarBtn"></i></a>
                        </div>
                        <h2 class="text-lg-center text-md-center">WELCOME TO DAYRO</h2>
                        <p class="text-lg-center text-md-center">The Soul of Gujarat's Folk Culture</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!--modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close text-danger">&times;</span>
            <h2 class="text-warning text-center">Login</h2>
            <div class="bg-img">
                <form id="loginForm" class="mt-3">
                    <input class="email" type="email" placeholder="enter your email" required><br><br>
                    <input class="password" type="password" placeholder="enter password" required><br><br>
                    <button type="submit" class="submit">Submit</button>
                    <input type="reset" value="reset" id="reset">
                </form>
            </div>
        </div>
    </div>
</body>

</html>
