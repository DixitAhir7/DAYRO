    <style>
        img {
            width: 100%;
        }

        .d-block {
            display: block;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background-color: white;
            height: 100vh;
            padding: 16px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            transition: width 0.3s ease;
            position: relative;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .sidebar-header i {
            font-size: 1.5rem;
            color: #333;
        }

        .sidebar-header span {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: #666;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .nav-item:not(.dropdown) {
            padding: 0.75rem;
            align-items: center;
            flex-direction: row;
            gap: 0.75rem;
        }

        .nav-item:hover:not(.dropdown),
        .dropdown-item:hover {
            background-color: #f5f5f5;
            color: #333;
        }

        .nav-item i {
            font-size: 1.1rem;
            width: 1.5rem;
            text-align: center;
        }

        .nav-item span {
            font-size: 1rem;
        }

        /* Dropdown styles */
        .dropdown {
            cursor: pointer;
        }

        .dropdown-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .dropdown-header:hover {
            background-color: #f5f5f5;
        }

        .dropdown-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .dropdown-icon {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .dropdown-content {
            display: none;
            padding-left: 2.25rem;
            margin-top: 0.25rem;
        }

        .dropdown.active .dropdown-content {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            text-decoration: none;
            color: #666;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .nav-divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 0.5rem 0;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
        }

        /* Collapsed state */
        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .sidebar-header span,
        .sidebar.collapsed .nav-item span,
        .sidebar.collapsed .dropdown-icon {
            display: none;
        }

        .sidebar.collapsed .nav-item,
        .sidebar.collapsed .dropdown-header {
            justify-content: center;
            padding: 0.75rem;
        }

        .sidebar.collapsed .dropdown-content {
            display: none !important;
        }

        .sidebar.collapsed .nav-item i {
            margin: 0;
        }

        /* Add a toggle button */
        .sidebar-toggle {
            position: absolute;
            top: 1rem;
            right: -2.5rem;
            background: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Media query for mobile devices */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                z-index: 1000;
            }
        }
    </style>

</head>

<body>

    <script>
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const toggleBtn = document.querySelector('.sidebar-toggle i');

            sidebar.classList.toggle('collapsed');

            // Change toggle button icon
            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.classList.remove('fa-chevron-left');
                toggleBtn.classList.add('fa-chevron-right');
            } else {
                toggleBtn.classList.remove('fa-chevron-right');
                toggleBtn.classList.add('fa-chevron-left');
            }
        }

        function toggleDropdown(element) {
            const dropdownContent = element.nextElementSibling;
            const dropdownIcon = element.querySelector('.dropdown-icon');
            const isCollapsed = document.querySelector('.sidebar').classList.contains('collapsed');

            if (!isCollapsed) {
                element.parentElement.classList.toggle('active');
                dropdownIcon.style.transform = element.parentElement.classList.contains('active')
                    ? 'rotate(180deg)'
                    : 'rotate(0)';
            }
        }

        // Add mobile support
        if (window.innerWidth <= 768) {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.add('collapsed');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
