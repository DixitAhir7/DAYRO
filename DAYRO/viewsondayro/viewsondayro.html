<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>views on dayro</title>
    <link rel="stylesheet" href="/css-bt/bootstrap.min.css">
    <script defer src="/js-bt/bootstrap.bundle.min.js"></script>
    <script type="module" defer src="viewsondayro.js"></script>
    <link rel="stylesheet" href="/css-bt/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="viewsondayro.css">
    <link rel="stylesheet" href="viewsondayromedia.css">
    <link rel="stylesheet" href="/bootstrap-icons/bootstrap-icons-1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container-fluid">
        <!-- animation header -->
        <div class="infoaboutviews">
            share your <span id="dynamic-text" class="highlight">views</span> about Dayro
        </div>

        <!-- for open source where users can add their views on dayro -->
        <div class="usersviews mt-4">
            <form>
                <textarea id="custom" placeholder="enter your views about dayro"></textarea>
            </form>
        </div>

        <!-- displaying views -->
        <div class="displayuserviews">
            <img src="" class="displayimg" alt="">
            <a class="displayemail text-black" href=""></a>
            <p id="view"></p>
        </div>


        <!-- buttons for views submit,delete,edit,undo,reply -->
        <div class="btnsfordisplay">
            <button title="submit" id="viewssubmit"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                    viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path
                        d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z" />
                </svg></button>
            <button title="delete" id="deleteviews" style="background: none;"><i class="bi bi-trash3"></i></button>
            <button title="edit" id="viewedit" style="background: none;"><svg xmlns="http://www.w3.org/2000/svg"
                    height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
                    <path
                        d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
                </svg></button>
            <button title="undo" id="undoview" style="background: none;"><i
                    class="bi bi-arrow-counterclockwise"></i></button>
            <button title="reply" id="viewreply" style="background: none;"><i class="bi bi-reply"></i></button>
        </div>

        <!-- to reply -->

        <div class="replydiv mt-3">
            <form>
                <textarea placeholder="reply"></textarea>
                <p id="viewreplytouser"></p>
            </form>

        </div>

        <div class="replydivbtns">
            <button id="submitreply"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#e3e3e3">
                    <path
                        d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z" />
                </svg></button>
            <button id="deletereply"><i class="bi bi-trash3"></i>
            </button>
        </div>
    </div>
</body>

</html>
